<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skedence - Stripe Configuration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #667eea;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .logo p {
            color: #6b7280;
            font-size: 14px;
        }

        .auth-section, .keys-section {
            display: none;
        }

        .auth-section.active, .keys-section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #5568d3;
        }

        .btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #6b7280;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background: #4b5563;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert-error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .alert-success {
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .alert-info {
            background: #eff6ff;
            color: #1e40af;
            border: 1px solid #bfdbfe;
        }

        .user-info {
            background: #f9fafb;
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .user-info p {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .user-info strong {
            color: #374151;
        }

        .help-text {
            font-size: 12px;
            color: #6b7280;
            margin-top: 6px;
        }

        .loading {
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .key-preview {
            font-family: monospace;
            font-size: 12px;
            color: #6b7280;
            margin-top: 8px;
            padding: 8px;
            background: #f9fafb;
            border-radius: 6px;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>🎯 Skedence</h1>
            <p>Stripe Configuration Portal</p>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p style="margin-top: 16px; color: #6b7280;">Loading...</p>
        </div>

        <!-- Authentication Section -->
        <div id="authSection" class="auth-section">
            <div id="authMessage"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="your@email.com" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                
                <button type="submit" class="btn" id="loginBtn">Sign In</button>
            </form>
        </div>

        <!-- Stripe Keys Section -->
        <div id="keysSection" class="keys-section">
            <div id="keysMessage"></div>
            
            <div class="user-info">
                <p><strong>Organization:</strong> <span id="orgName">Loading...</span></p>
                <p><strong>Email:</strong> <span id="userEmail">Loading...</span></p>
            </div>

            <form id="keysForm">
                <div class="form-group">
                    <label for="publishableKey">Stripe Publishable Key</label>
                    <input type="text" id="publishableKey" placeholder="pk_live_..." required>
                    <p class="help-text">Starts with pk_live_ or pk_test_</p>
                    <div id="pkPreview" class="key-preview" style="display: none;"></div>
                </div>
                
                <div class="form-group">
                    <label for="secretKey">Stripe Secret Key</label>
                    <input type="password" id="secretKey" placeholder="sk_live_..." required>
                    <p class="help-text">Starts with sk_live_ or sk_test_ (kept secure)</p>
                    <div id="skPreview" class="key-preview" style="display: none;"></div>
                </div>
                
                <button type="submit" class="btn" id="saveBtn">Save Stripe Keys</button>
                <button type="button" class="btn btn-secondary" id="signOutBtn">Sign Out</button>
            </form>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDxD9TRnxGUO7fKb2NnXf_OoGQQKYX0eNY",
            authDomain: "polyface-ae6d3.firebaseapp.com",
            projectId: "polyface-ae6d3",
            storageBucket: "polyface-ae6d3.firebasestorage.app",
            messagingSenderId: "662990832682",
            appId: "1:662990832682:web:30bb35d5ba3c0c28e5c73f",
            measurementId: "G-HJVF0BWRKN"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let currentOrgId = null;
        let currentOrgName = null;

        // DOM Elements
        const loading = document.getElementById('loading');
        const authSection = document.getElementById('authSection');
        const keysSection = document.getElementById('keysSection');
        const loginForm = document.getElementById('loginForm');
        const keysForm = document.getElementById('keysForm');
        const signOutBtn = document.getElementById('signOutBtn');

        // Show/Hide sections
        function showLoading() {
            loading.style.display = 'block';
            authSection.classList.remove('active');
            keysSection.classList.remove('active');
        }

        function showAuth() {
            loading.style.display = 'none';
            authSection.classList.add('active');
            keysSection.classList.remove('active');
        }

        function showKeys() {
            loading.style.display = 'none';
            authSection.classList.remove('active');
            keysSection.classList.add('active');
        }

        // Show messages
        function showMessage(elementId, type, message) {
            const el = document.getElementById(elementId);
            el.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            setTimeout(() => {
                el.innerHTML = '';
            }, 5000);
        }

        // Auth state observer
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('userEmail').textContent = user.email;
                
                try {
                    // Find user's organization
                    const orgsSnapshot = await db.collection('organizations')
                        .where('members', 'array-contains', user.uid)
                        .limit(1)
                        .get();

                    if (orgsSnapshot.empty) {
                        showMessage('keysMessage', 'error', 'No organization found for your account.');
                        showAuth();
                        await auth.signOut();
                        return;
                    }

                    const orgDoc = orgsSnapshot.docs[0];
                    currentOrgId = orgDoc.id;
                    currentOrgName = orgDoc.data().name || 'Your Organization';
                    document.getElementById('orgName').textContent = currentOrgName;

                    // Check if user is owner
                    const memberDoc = await db.collection('organizations')
                        .doc(currentOrgId)
                        .collection('orgMembers')
                        .doc(user.uid)
                        .get();

                    if (!memberDoc.exists || memberDoc.data().role !== 'owner') {
                        showMessage('keysMessage', 'error', 'Only organization owners can configure Stripe keys.');
                        showAuth();
                        await auth.signOut();
                        return;
                    }

                    // Load existing keys
                    await loadExistingKeys();
                    showKeys();

                } catch (error) {
                    console.error('Error loading organization:', error);
                    showMessage('keysMessage', 'error', 'Error loading organization data: ' + error.message);
                    showAuth();
                }
            } else {
                currentUser = null;
                currentOrgId = null;
                showAuth();
            }
        });

        // Load existing keys
        async function loadExistingKeys() {
            try {
                const stripeDoc = await db.collection('organizations')
                    .doc(currentOrgId)
                    .collection('stripe')
                    .doc('config')
                    .get();

                if (stripeDoc.exists) {
                    const data = stripeDoc.data();
                    if (data.publishableKey) {
                        document.getElementById('publishableKey').value = data.publishableKey;
                        showKeyPreview('pk', data.publishableKey);
                    }
                    if (data.secretKey) {
                        // Don't show the full secret key for security
                        document.getElementById('secretKey').placeholder = 'sk_****...' + data.secretKey.slice(-4);
                        showKeyPreview('sk', 'Configured (ending in ...' + data.secretKey.slice(-4) + ')');
                    }
                    showMessage('keysMessage', 'info', 'Existing keys loaded. Update them below if needed.');
                }
            } catch (error) {
                console.error('Error loading keys:', error);
            }
        }

        // Show key preview
        function showKeyPreview(type, value) {
            const previewId = type === 'pk' ? 'pkPreview' : 'skPreview';
            const preview = document.getElementById(previewId);
            preview.textContent = value;
            preview.style.display = 'block';
        }

        // Login
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');

            loginBtn.disabled = true;
            loginBtn.textContent = 'Signing in...';

            try {
                await auth.signInWithEmailAndPassword(email, password);
                // Auth state observer will handle the rest
            } catch (error) {
                console.error('Login error:', error);
                showMessage('authMessage', 'error', 'Login failed: ' + error.message);
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In';
            }
        });

        // Save keys
        keysForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const publishableKey = document.getElementById('publishableKey').value.trim();
            const secretKey = document.getElementById('secretKey').value.trim();
            const saveBtn = document.getElementById('saveBtn');

            // Validate keys format
            if (!publishableKey.startsWith('pk_')) {
                showMessage('keysMessage', 'error', 'Publishable key must start with pk_live_ or pk_test_');
                return;
            }

            if (!secretKey.startsWith('sk_')) {
                showMessage('keysMessage', 'error', 'Secret key must start with sk_live_ or sk_test_');
                return;
            }

            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving...';

            try {
                await db.collection('organizations')
                    .doc(currentOrgId)
                    .collection('stripe')
                    .doc('config')
                    .set({
                        publishableKey: publishableKey,
                        secretKey: secretKey,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                        updatedBy: currentUser.uid
                    }, { merge: true });

                showMessage('keysMessage', 'success', '✅ Stripe keys saved successfully! Your apps will use these keys for payments.');
                
                // Update previews
                showKeyPreview('pk', publishableKey);
                showKeyPreview('sk', 'Configured (ending in ...' + secretKey.slice(-4) + ')');

                // Clear the secret key field for security
                document.getElementById('secretKey').value = '';
                document.getElementById('secretKey').placeholder = 'sk_****...' + secretKey.slice(-4);

            } catch (error) {
                console.error('Error saving keys:', error);
                showMessage('keysMessage', 'error', 'Failed to save keys: ' + error.message);
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = 'Save Stripe Keys';
            }
        });

        // Sign out
        signOutBtn.addEventListener('click', async () => {
            try {
                await auth.signOut();
                document.getElementById('email').value = '';
                document.getElementById('password').value = '';
                document.getElementById('publishableKey').value = '';
                document.getElementById('secretKey').value = '';
            } catch (error) {
                console.error('Sign out error:', error);
            }
        });

        // Key input listeners for preview
        document.getElementById('publishableKey').addEventListener('input', (e) => {
            const value = e.target.value;
            if (value) {
                showKeyPreview('pk', value);
            }
        });

        document.getElementById('secretKey').addEventListener('input', (e) => {
            const value = e.target.value;
            if (value) {
                showKeyPreview('sk', value.substring(0, 7) + '****' + value.slice(-4));
            }
        });
    </script>
</body>
</html>
