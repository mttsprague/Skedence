<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skedence - Admin Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 60px 40px;
            text-align: center;
        }

        .logo {
            font-size: 64px;
            margin-bottom: 20px;
        }

        h1 {
            color: #667eea;
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        p {
            color: #6b7280;
            font-size: 18px;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .admin-links {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 40px;
        }

        .admin-link {
            display: flex;
            align-items: center;
            padding: 24px;
            background: #f9fafb;
            border-radius: 16px;
            text-decoration: none;
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .admin-link:hover {
            background: #eff6ff;
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.1);
        }

        .admin-link .icon {
            font-size: 32px;
            margin-right: 20px;
        }

        .admin-link .content {
            flex: 1;
            text-align: left;
        }

        .admin-link .title {
            color: #374151;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .admin-link .description {
            color: #6b7280;
            font-size: 14px;
        }

        .admin-link .arrow {
            color: #9ca3af;
            font-size: 24px;
        }

        .footer {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #e5e7eb;
            color: #9ca3af;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🎯</div>
        <h1>Skedence</h1>
        <p>Welcome to the Skedence Admin Portal. Configure your organization's settings and integrations.</p>

        <div class="admin-links">
            <a href="/stripe-keys.html" class="admin-link">
                <div class="icon">💳</div>
                <div class="content">
                    <div class="title">Stripe Configuration</div>
                    <div class="description">Manage your payment gateway keys and settings</div>
                </div>
                <div class="arrow">→</div>
            </a>

            <!-- Add more admin links in the future -->
            <!--
            <a href="/settings.html" class="admin-link">
                <div class="icon">⚙️</div>
                <div class="content">
                    <div class="title">Organization Settings</div>
                    <div class="description">Update your organization details and preferences</div>
                </div>
                <div class="arrow">→</div>
            </a>
            -->
        </div>

        <div class="footer">
            © 2026 Skedence. Owner access only.
        </div>
    </div>
</body>
</html>
